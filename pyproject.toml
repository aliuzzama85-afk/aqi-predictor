[project]
name = "aqi-predictor"
version = "0.1.0"
description = "Forecasts AQI 3 days ahead"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.0.2",
    "scikit-learn==1.9.0",
    "tensorflow==2.18.0",
    "hopsworks==5.0.6",
    "confluent-kafka==2.15.0",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "shap==0.52.0",
    "streamlit==1.60.0",
    "plotly==7.0.0",
    "pytest==9.1.1",
]

[project.optional-dependencies]
notebook = [
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "ipykernel==6.29.5",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aqi_predictor"]
