[project]
name = "aqi-predictor"
version = "0.1.0"
description = "Forecasts AQI 3 days ahead"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.0.2",
    "scikit-learn==1.9.0",
    "tensorflow==2.18.0",
    "hopsworks==5.0.6",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "shap==0.52.0",
    "streamlit==1.60.0",
    "plotly==7.0.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aqi_predictor"]
